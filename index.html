<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Baby Yuden 💕 Blooming Lily</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #fd79a8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .title {
            font-size: 3.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .lily-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            height: 400px;
        }

        svg {
            max-width: 300px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }

        /* Lily Petals - 6 petals */
        .petal {
            transform-origin: 100px 150px;
            animation: bloomPetal 4s ease-in-out forwards;
        }

        .petal1 { animation-delay: 0.2s; }
        .petal2 { animation-delay: 0.4s; }
        .petal3 { animation-delay: 0.6s; }
        .petal4 { animation-delay: 0.8s; }
        .petal5 { animation-delay: 1s; }
        .petal6 { animation-delay: 1.2s; }

        @keyframes bloomPetal {
            0% {
                transform: scale(0.1) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .center {
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
            }
            50% {
                filter: drop-shadow(0 0 18px rgba(255, 215, 0, 1));
            }
        }

        .messages-container {
            margin-top: 40px;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .message {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.2em;
            color: #ff6b9d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 8px auto;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            font-weight: bold;
            max-width: 95%;
            word-break: break-word;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(-30px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .sparkle {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: sparkleAnim 1.5s ease-in-out infinite;
            pointer-events: none;
        }

        .sparkle:nth-child(1) {
            top: 10%;
            left: 15%;
            animation-delay: 0s;
        }

        .sparkle:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-delay: 0.5s;
        }

        .sparkle:nth-child(3) {
            bottom: 15%;
            left: 10%;
            animation-delay: 1s;
        }

        .sparkle:nth-child(4) {
            bottom: 10%;
            right: 15%;
            animation-delay: 0.3s;
        }

        @keyframes sparkleAnim {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .heart {
            display: inline-block;
            animation: heartbeat 1.2s ease-in-out infinite;
            margin: 0 5px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.3);
            }
            50% {
                transform: scale(1);
            }
        }

        .counter {
            margin-top: 20px;
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 157, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 107, 157, 0.8);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5em;
            }

            .message {
                font-size: 1em;
                padding: 10px 20px;
            }

            .lily-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="container">
        <h1 class="title">I <span class="heart">💕</span> YOU BABY YUDEN</h1>

        <div class="lily-container">
            <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Stem -->
                <line x1="100" y1="300" x2="100" y2="140" stroke="#2d5016" stroke-width="4" stroke-linecap="round"/>
                <!-- Stem details -->
                <ellipse cx="97" cy="250" rx="2" ry="6" fill="#2d5016" opacity="0.7"/>
                <ellipse cx="103" cy="200" rx="2" ry="6" fill="#2d5016" opacity="0.7"/>
                <ellipse cx="98" cy="170" rx="2" ry="6" fill="#2d5016" opacity="0.7"/>

                <!-- 6 Lily Petals - Pink/Magenta -->
                <!-- Petal 1 (Top) -->
                <path class="petal petal1" d="M 100 140 Q 95 90 100 50 Q 105 90 100 140" fill="#ff1493" stroke="#c71585" stroke-width="2" opacity="0.95"/>
                
                <!-- Petal 2 (Top Right) -->
                <path class="petal petal2" d="M 100 140 Q 125 95 155 70 Q 120 115 100 140" fill="#ff69b4" stroke="#c71585" stroke-width="2" opacity="0.95"/>
                
                <!-- Petal 3 (Bottom Right) -->
                <path class="petal petal3" d="M 100 140 Q 135 165 160 200 Q 125 170 100 140" fill="#ff1493" stroke="#c71585" stroke-width="2" opacity="0.95"/>
                
                <!-- Petal 4 (Bottom) -->
                <path class="petal petal4" d="M 100 140 Q 105 190 100 230 Q 95 190 100 140" fill="#ff69b4" stroke="#c71585" stroke-width="2" opacity="0.95"/>
                
                <!-- Petal 5 (Bottom Left) -->
                <path class="petal petal5" d="M 100 140 Q 65 165 40 200 Q 75 170 100 140" fill="#ff1493" stroke="#c71585" stroke-width="2" opacity="0.95"/>
                
                <!-- Petal 6 (Top Left) -->
                <path class="petal petal6" d="M 100 140 Q 75 95 45 70 Q 80 115 100 140" fill="#ff69b4" stroke="#c71585" stroke-width="2" opacity="0.95"/>

                <!-- Lily Center - Yellow stamen -->
                <g class="center">
                    <circle cx="100" cy="140" r="20" fill="#ffd700" stroke="#ffed4e" stroke-width="2"/>
                    <circle cx="100" cy="140" r="14" fill="#fff44f"/>
                    <circle cx="100" cy="138" r="6" fill="#fffacd" opacity="0.9"/>
                    <!-- Stamen details -->
                    <circle cx="95" cy="142" r="3" fill="#ffb6c1" opacity="0.7"/>
                    <circle cx="105" cy="142" r="3" fill="#ffb6c1" opacity="0.7"/>
                    <circle cx="100" cy="148" r="3" fill="#ffb6c1" opacity="0.7"/>
                </g>
            </svg>
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be added here by JavaScript -->
        </div>

        <div class="counter">
            <span id="messageCount">0</span> / 10,000 💕 I love you baby Yuden!
        </div>
    </div>

    <script>
        const container = document.getElementById('messagesContainer');
        const counter = document.getElementById('messageCount');
        const totalMessages = 10000;

        // Generate all messages at once
        for (let i = 1; i <= totalMessages; i++) {
            const message = document.createElement('div');
            message.className = 'message';
            message.textContent = `💕 I love you baby Yuden! 💕 (#${i})`;
            
            // Calculate animation delay - spread them out over time
            const delay = (i - 1) * 0.05; // 50ms between each message
            message.style.animationDelay = delay + 's';
            
            container.appendChild(message);
            
            // Update counter
            if (i % 100 === 0) {
                counter.textContent = i;
            }
        }
        
        // Final counter update
        counter.textContent = totalMessages;

        // Auto scroll to show new messages
        const scrollInterval = setInterval(() => {
            container.scrollTop = container.scrollHeight;
        }, 100);

        // Stop scrolling after all messages appear
        setTimeout(() => {
            clearInterval(scrollInterval);
        }, totalMessages * 50);
    </script>
</body>
</html>
